<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBSAP Monitoring System · Rwanda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --navy: #0f2744;
        --navy-mid: #1e3a5f;
        --sky: #38bdf8;
        --sky-dim: #0ea5e9;
        --emerald: #10b981;
        --amber: #f59e0b;
        --rose: #f43f5e;
        --indigo: #6366f1;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --surface-3: #f1f5f9;
        --border: #e2e8f0;
        --text-1: #0f172a;
        --text-2: #475569;
        --text-3: #94a3b8;
        --radius: 14px;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
        --shadow-md: 0 4px 12px rgba(0,0,0,.1);
        --shadow-lg: 0 12px 32px rgba(0,0,0,.14);
        --sidebar-w: 248px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--surface-2);
        color: var(--text-1);
        min-height: 100vh;
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: var(--surface-2); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse-green {
        0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.6); }
        50%      { box-shadow: 0 0 0 5px rgba(16,185,129,0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

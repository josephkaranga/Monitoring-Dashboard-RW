<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' data:; img-src 'self' data: https:; frame-src https://rbis.ur.ac.rw; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.anthropic.com https://api.gbif.org https://rbis.ur.ac.rw https://www.geoboundaries.org https://*.geoboundaries.org https://api.allorigins.win;" />
    <title>NBSAP Monitoring System · Rwanda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --navy: #0f2744;
        --navy-mid: #1e3a5f;
        --sky: #38bdf8;
        --sky-dim: #0ea5e9;
        --emerald: #10b981;
        --amber: #f59e0b;
        --rose: #f43f5e;
        --indigo: #6366f1;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --surface-3: #f1f5f9;
        --border: #e2e8f0;
        --text-1: #0f172a;
        --text-2: #475569;
        --text-3: #94a3b8;
        --radius: 14px;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
        --shadow-md: 0 4px 12px rgba(0,0,0,.1);
        --shadow-lg: 0 12px 32px rgba(0,0,0,.14);
        --sidebar-w: 248px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--surface-2);
        color: var(--text-1);
        min-height: 100vh;
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: var(--surface-2); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse-green {
        0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.6); }
        50%      { box-shadow: 0 0 0 5px rgba(16,185,129,0); }
      }

      /* ── Responsive overrides ─────────────────────────────── */
      @media (max-width: 768px) {
        /* Metric cards stack on mobile */
        .metric-row { flex-direction: column !important; }

        /* 2-col grids collapse to 1 on small screens */
        .grid-2col { grid-template-columns: 1fr !important; }

        /* Compliance trend: 3 cols on mobile instead of 5 */
        .compliance-trend { grid-template-columns: repeat(3, 1fr) !important; }

        /* Dashboard charts stack */
        .charts-grid { grid-template-columns: 1fr !important; }

        /* Page content padding reduction */
        main > div { padding: 16px !important; }
      }

      @media (max-width: 480px) {
        /* Single column on very small screens */
        .compliance-trend { grid-template-columns: repeat(2, 1fr) !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
